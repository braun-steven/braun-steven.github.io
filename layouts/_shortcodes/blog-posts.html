{{- /* Lists all blog posts, newest first. Usage: {{< blog-posts >}} */ -}}
<ul class="post-list">
{{- range (site.GetPage "/blog").RegularPages.ByDate.Reverse }}
  <li><time class="post-date" datetime="{{ .Date.Format "2006-01-02" }}">{{ .Date.Format "2006-01-02" }}</time> <a href="{{ .RelPermalink }}">{{ .Title }}</a></li>
{{- end }}
</ul>
