{{/* Project override: version the favicon URLs to bypass browser favicon caches. */}}
{{- $v := site.Params.faviconVersion | default "1" -}}
<link rel="icon shortcut" href="{{ "favicon.ico" | relURL }}?v={{ $v }}" sizes="32x32" />
<link rel="icon" href="{{ "favicon.svg" | relURL }}?v={{ $v }}" type="image/svg+xml" id="favicon-svg" />
<link rel="icon" href="{{ "favicon-16x16.png" | relURL }}?v={{ $v }}" type="image/png" sizes="16x16" />
<link rel="icon" href="{{ "favicon-32x32.png" | relURL }}?v={{ $v }}" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="{{ "apple-touch-icon.png" | relURL }}?v={{ $v }}" sizes="180x180" />
<link fetchpriority="low" href="{{ "site.webmanifest" | relURL }}?v={{ $v }}" rel="manifest" />
