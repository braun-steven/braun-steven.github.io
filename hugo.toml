baseURL = "https://stevenbraun.dev/"
locale = "en-US"
title = "Steven Braun"
theme = "hextra"
enableRobotsTXT = true

# Hextra adds markdown/llms outputs by default; keep the site to plain HTML + RSS
[outputs]
  home = ["html"]
  page = ["html"]
  section = ["html", "rss"]

[markup]
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.goldmark.renderer]
    # Posts contain raw HTML (figures, image grids)
    unsafe = true
  [markup.goldmark.extensions.passthrough]
    enable = true
    [markup.goldmark.extensions.passthrough.delimiters]
      # Posts use $$..$$ (display) and \(..\) (inline); Hextra renders them server-side with KaTeX
      block = [["$$", "$$"], ["\\[", "\\]"]]
      inline = [["\\(", "\\)"]]

[params]
  description = "PhD in Machine Learning from TU Darmstadt (AIML Lab)"
  dateFormat = "January 2, 2006"
  externalLinkDecoration = false

  [params.page]
    width = "normal"

  [params.theme]
    default = "system"

  [params.footer]
    enable = false
    displayCopyright = true
    displayPoweredBy = false
    width = "normal"

  [params.search]
    # No navbar, so nothing could open the search dialog
    enable = false

  [params.blog.article]
    displayPagination = true

  [params.highlight.copy]
    enable = true
    display = "hover"

  [params.social]
    twitter = "sbraunmz"

  [params.comments]
    enable = false  # turned on for blog posts via the cascade in content/blog/_index.md
    type = "giscus"
    [params.comments.giscus]
      repo = "braun-steven/braun-steven.github.io"
      repoId = "R_kgDOGIe7LA"
      category = "Comments"
      categoryId = "DIC_kwDOGIe7LM4CUi45"
